apiVersion: v1alpha1
kind: Setting
metadata:
  name: hotspot-news-settings
spec:
  forms:
    - group: basic
      label: 基础设置
      formSchema:
        - $formkit: switch
          name: jokeEnabled
          label: 启用笑话
          help: 关闭后将不再展示内置笑话集内容
          value: true
        - $formkit: switch
          name: soupEnabled
          label: 启用心灵鸡汤
          help: 关闭后将不再同步一言（hitokoto）句子
          value: true
        - $formkit: number
          name: intervalMinutes
          label: 自动同步间隔（分钟）
          value: 30
          help: 每到间隔时间自动换一批笑话与鸡汤
          validation: required|min:5|max:1440
        - $formkit: number
          name: maxItemsPerSource
          label: 每个来源保留条数
          value: 50
          validation: required|min:1|max:100
        - $formkit: text
          name: soupApiBase
          label: 一言句子库地址
          value: https://cdn.jsdelivr.net/gh/hitokoto-osc/sentences-bundle@master/sentences/
          help: 心灵鸡汤数据源（hitokoto sentences-bundle CDN），每次同步随机取文学/诗词/哲学一类
        - $formkit: textarea
          name: userAgent
          label: 请求 User-Agent
          value: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36
          help: 抓取外部站点时携带的浏览器 UA，可按需修改